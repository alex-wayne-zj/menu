location = /menu {
    return 302 https://zhangjian.dev/menu/;
}
location ^~ /menu/ {
    if ($host != zhangjian.dev) { return 302 https://zhangjian.dev$request_uri; }
    alias /var/www/menu/current/;
    index index.html;
    autoindex off;
    limit_conn menu_connections 15;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri $uri/ /menu/index.html;

    location ^~ /menu/assets/ {
        alias /var/www/menu/current/assets/;
        expires 1y;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ ^/menu/api/auth/(login|register)$ {
        add_header Cache-Control "private, no-store" always;
        limit_req zone=menu_login burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        rewrite ^/menu/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8079;
        include /etc/nginx/snippets/menu-proxy.conf;
    }
    location = /menu/api/images {
        add_header Cache-Control "private, no-store" always;
        limit_req zone=menu_api burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 11m;
        client_body_timeout 15s;
        rewrite ^/menu/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8079;
        include /etc/nginx/snippets/menu-proxy.conf;
    }
    location /menu/api/images/ {
        limit_req zone=menu_images burst=80 nodelay;
        limit_req_status 429;
        limit_except GET HEAD { deny all; }
        rewrite ^/menu/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8079;
        include /etc/nginx/snippets/menu-proxy.conf;
    }
    location /menu/api/ {
        add_header Cache-Control "private, no-store" always;
        limit_req zone=menu_api burst=30 nodelay;
        limit_req_status 429;
        limit_conn_status 429;
        client_max_body_size 11m;
        client_body_timeout 15s;
        rewrite ^/menu/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8079;
        include /etc/nginx/snippets/menu-proxy.conf;
    }
}
